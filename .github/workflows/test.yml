name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install uv
        run: python -m pip install uv
      - name: Confirm selected application interpreter
        run: uv run --python '${{ matrix.python }}' --frozen --project wayline python -c 'import sys; print(sys.version)'
      - name: Run regression suite
        run: uv run --python '${{ matrix.python }}' --frozen --project wayline --group dev pytest
      - name: Verify isolated wheel installation without models
        run: python scripts/check-install.py --python '${{ matrix.python }}'
