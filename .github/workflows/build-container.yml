name: Optional source container build

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - docker-compose.yaml
      - container/**
      - wayline/**
      - .github/workflows/build-container.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build application from this checkout
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: wayline-app:local
      - name: Build generic worker from this checkout
        uses: docker/build-push-action@v6
        with:
          context: ./container
          push: false
          tags: wayline-worker:local
