# Deterministic host-local mock execution. No model, credential or Docker calls.
server: http://127.0.0.1:8000
runtime:
  execution: local
  interval: 1
  max_workers: 2
  max_running_projects: 2
  max_project_workers: 2
  healthcheck_timeout: 2
  worker_healthcheck: disabled
  prompt_group: mock
tasks:
  bootstrap:
    timeout: 10
    conclude_timeout: 5
  reason:
    timeout: 10
    max_intents: 2
  explore:
    timeout: 10
    conclude_timeout: 5
local:
  completed_action: keep
workers:
- name: mock-worker
  type: mock
  task_types:
  - bootstrap
  - reason
  - explore
  max_running: 2
  priority: 0
  env:
    MOCK_HEALTHCHECK: '{"delay": [0, 0], "outcomes": {"fail": 0, "ok": 1}}'
    MOCK_BOOTSTRAP: '{"delay": [0, 0], "outcomes": {"command_fail": 0, "complete":
      1, "fact": 0, "invalid_json": 0, "invalid_payload": 0, "rejected": 0}}'
    MOCK_REASON: '{"delay": [0, 0], "outcomes": {"command_fail": 0, "complete": 1,
      "intent": 0, "invalid_json": 0, "invalid_payload": 0, "noop": 0, "rejected":
      0}}'
    MOCK_EXPLORE_EXECUTE: '{"delay": [0, 0], "outcomes": {"command_fail": 0, "fact":
      1, "invalid_json": 0, "invalid_payload": 0, "rejected": 0}}'
    MOCK_EXPLORE_CONCLUDE: '{"delay": [0, 0], "outcomes": {"command_fail": 0, "fact":
      1, "invalid_json": 0, "invalid_payload": 0, "rejected": 0}}'
    MOCK_BOOTSTRAP_CONCLUDE: '{"delay": [0, 0], "outcomes": {"command_fail": 0, "fact":
      1, "invalid_json": 0, "invalid_payload": 0, "rejected": 0}}'
