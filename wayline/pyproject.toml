[project]
name = "wayline"
version = "0.3.0"
description = "Adaptive agent workflows with shared facts, staged goals, and Pi sessions"
license = { file = "src/wayline/LICENSE" }
authors = [
    { name = "leixiao", email = "1729888211@qq.com" }
]
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "click>=8.1",
    "pyyaml>=6.0",
    "docker>=7.1.0",
    "requests>=2.32.3",
]

[project.urls]
Homepage = "https://github.com/Prisma-Labs-Dev/Wayline"
Repository = "https://github.com/Prisma-Labs-Dev/Wayline"
Issues = "https://github.com/Prisma-Labs-Dev/Wayline/issues"
Upstream = "https://github.com/oritera/Cairn"

[project.scripts]
wayline = "wayline.cli:main"

[build-system]
requires = ["uv_build>=0.8.9,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
