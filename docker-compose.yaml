services:
  wayline-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: wayline-app:local
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./datas/wayline/:/root/.local/share/wayline/
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/projects', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 3s
    restart: unless-stopped
  # Optional Docker-worker route. Host-local Pi dispatch runs on the host instead.
  wayline-dispatcher:
    profiles: [container-dispatcher]
    build:
      context: .
      dockerfile: Dockerfile
    image: wayline-app:local
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./dispatch.yaml:/app/dispatch.yaml:ro
      - ./datas/dispatcher/:/root/.local/share/wayline/
    depends_on:
      wayline-server:
        condition: service_healthy
    restart: unless-stopped
    command: ["wayline", "dispatch", "--config", "/app/dispatch.yaml"]
